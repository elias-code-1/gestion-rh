<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dossier RH — Connexion</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">

  <div class="auth-showcase">
    <div class="auth-showcase-content">
      <div class="auth-brand">Dossier RH</div>
      <h1>Bon retour parmi nous</h1>
      <p>Connectez-vous pour retrouver le tableau de bord, la liste des employés et le suivi des absences et congés.</p>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-form-wrap">
      <h2>Connexion</h2>
      <p class="auth-subtitle">Entrez vos identifiants pour continuer.</p>

      <div class="auth-error" id="auth-error"></div>

      <form id="login-form">
        <div class="field">
          <label for="login-email">Adresse email</label>
          <input type="email" id="login-email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="login-password">Mot de passe</label>
          <input type="password" id="login-password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" id="login-submit">Se connecter</button>
      </form>

      <p class="auth-switch">Pas encore de compte ? <a href="signup.html">Créer un compte</a></p>
    </div>
  </div>

</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
