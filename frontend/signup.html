<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dossier RH — Créer un compte</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">

  <div class="auth-showcase">
    <div class="auth-showcase-content">
      <div class="auth-brand">Dossier RH</div>
      <h1>Bienvenue</h1>
      <p>Créez votre compte pour accéder au tableau de bord et gérer le personnel : employés, absences et congés.</p>
    </div>
  </div>

  <div class="auth-form-side">
    <div class="auth-form-wrap">
      <h2>Créer un compte</h2>
      <p class="auth-subtitle">Quelques informations suffisent.</p>

      <div class="auth-error" id="auth-error"></div>

      <form id="signup-form">
        <div class="field">
          <label for="signup-nom">Nom</label>
          <input type="text" id="signup-nom" autocomplete="name">
        </div>
        <div class="field">
          <label for="signup-email">Adresse email</label>
          <input type="email" id="signup-email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="signup-password">Mot de passe</label>
          <input type="password" id="signup-password" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary" id="signup-submit">Créer mon compte</button>
      </form>

      <p class="auth-switch">Déjà un compte ? <a href="login.html">Se connecter</a></p>
    </div>
  </div>

</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
